name: Web CI

on:
  push:
    branches: [main, feature/supabase-admin-integration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build web app
        env:
          VITE_SUPABASE_URL: https://biwcwwxsauineaowreot.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_qDAFSNM5vXuEFEh6ma7Xaw_Se8DCQQu
        run: npm run build
