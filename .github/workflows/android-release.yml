name: Android APK

on:
  push:
    branches: [main, feature/supabase-admin-integration]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        env:
          VITE_SUPABASE_URL: https://biwcwwxsauineaowreot.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_qDAFSNM5vXuEFEh6ma7Xaw_Se8DCQQu
        run: |
          npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Add Android platform and sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build installable debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omax-android-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
